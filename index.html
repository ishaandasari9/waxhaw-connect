<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173f35" />
    <meta name="description" content="Waxhaw Connect helps residents find trusted local services, programs, events, and urgent support." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      /* Applied before first paint so a dark-mode visitor never sees a white flash. */
      try {
        var saved = JSON.parse(localStorage.getItem('waxhaw-accessibility') || '{}')
        if (saved.theme) document.documentElement.dataset.theme = saved.theme
        if (saved.contrast) document.documentElement.dataset.contrast = 'high'
        var dark = saved.theme === 'dark' || ((!saved.theme || saved.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000b05')
      } catch (e) {}
    </script>
    <title>Waxhaw Connect | Community resources for every stage of life</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
